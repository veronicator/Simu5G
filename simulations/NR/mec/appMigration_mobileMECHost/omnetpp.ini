[General]
### multiCell_mobileMecHost scenario ###
network = simu5g.simulations.NR.mec.appMigration_mobileMECHost.appMigration_mobileMECHost
cmdenv-autoflush = true

**.routingRecorder.enabled = false

##########################################################
#            Output Format Results                       #
##########################################################
num-rngs = 3
repeat = 1
seed-set = ${repetition}
output-scalar-file = ${resultdir}/${configname}/${configname}-${iterationvarsf}${repetition}.sca
output-vector-file = ${resultdir}/${configname}/${configname}-${iterationvarsf}${repetition}.vec

**.sctp.**.scalar-recording = false  # remove annoying statistics from SCTP
**.sctp.**.vector-recording = false  # remove annoying statistics from SCTP

**.scalar-recording = true
**.vector-recording = false

############### SCTP configuration ##################
**.sctp.nagleEnabled = false         # if true, transmission of small packets will be delayed on the X2
**.sctp.enableHeartbeats = false


##########################################################
#            Simulation parameters                       #
##########################################################
debug-on-errors = false
print-undisposed = true

sim-time-limit = 60s
warmup-period = 0s

*.playgroundSizeX = 2500m
*.playgroundSizeY = 2500m
*.playgroundSizeZ = 50m


############### IPv4 configurator config #################
#**.routingTable.netmaskRoutes = ""
#**.configurator.addSubnetRoutes = false
#**.configurator.addDefaultRoutes = false
*.configurator.config = xmldoc("./demo.xml")
**.configurator.dumpRoutes = true


##########################################################
#              NR specific parameters                   #
##########################################################
############### General PHY parameters ##############
*.gnb*.cellInfo.broadcastMessageInterval = 0.5s
**.fbPeriod = 40tti   # reports CQI every 40ms
**.amcType = "NRAmc"
**.pilotMode = "STDDEV_CQI"
**.targetBler = 0.001
**.blerShift = 5
**.fading = false

#**.downlink_interference = true
#**.uplink_interference = true
#**.ueTxPower = 26dBm
#**.eNodeBTxPower = 46dBm

# ----------------------------------------------------------------------------- #

#######################################################
#        CA and channel model configuration           #
#######################################################
*.carrierAggregation.numComponentCarriers = 1
*.carrierAggregation.componentCarrier[0].carrierFrequency = 2GHz
*.carrierAggregation.componentCarrier[0].numBands = 50	#${rbs=13}
*.carrierAggregation.componentCarrier[0].numerologyIndex = 0	# ${u=2}

*.*.cellularNic.LteChannelModelType = "NRChannelModel"
*.gnb*.cellularNic.numCarriers = 1
*.gnb*.cellularNic.channelModel[0].componentCarrierModule = "carrierAggregation.componentCarrier[0]"

*.ue[*].cellularNic.numCarriers = 1
*.ue[*].cellularNic.nrChannelModel[0].componentCarrierModule = "carrierAggregation.componentCarrier[0]"

*.mobileMecHost.cellularNic.numCarriers = 1
*.mobileMecHost.cellularNic.nrChannelModel[0].componentCarrierModule = "carrierAggregation.componentCarrier[0]"

################# X2 configuration #################                                     
*.gnb*.numX2Apps = 1                                        # one x2App per peering node
*.gnb*.x2App[*].server.localPort = 5000 + ancestorIndex(1)  # Server ports (x2App[0]=5000, x2App[1]=5001, ...)

*.gnb1.x2App[0].client.connectAddress = "gnb2%x2ppp0"
*.gnb2.x2App[0].client.connectAddress = "gnb1%x2ppp0"


############### Internet Cloud configuration ##############

**.internet.ipv4Delayer.rng-0 = 1
**.internet.ipv4Delayer.config = xmldoc("internetCloud.xml")

##########################################################
#                      Mobility                          #
##########################################################
**.mobility.constraintAreaMinZ = 0m
**.mobility.constraintAreaMaxZ = 0m

#------------UE config---------------
**.ue[*].mobility.initFromDisplayString = false
**.ue[*].mobility.typename = "RandomWaypointMobility"
**.ue[*].mobility.updateInterval = 0.05s

**.numUes = 3
# UE mobility limited in a rectangular area inside the coverage area of the gNodeB
**.ue[*].mobility.constraintAreaMinX = 200m
**.ue[*].mobility.constraintAreaMaxX = 575m
**.ue[*].mobility.constraintAreaMinY = 250m
**.ue[*].mobility.constraintAreaMaxY = 750m
**.ue[*].mobility.constraintAreaMinZ = 0m
**.ue[*].mobility.constraintAreaMaxZ = 0m

**.ue[*].mobility.initialX = uniform(this.constraintAreaMinX, this.constraintAreaMaxX)
**.ue[*].mobility.initialY = uniform(this.constraintAreaMinY, this.constraintAreaMaxY)
**.ue[*].mobility.speed = exponential(10mps)

**.ue[*].masterId = 0
**.ue[*].macCellId = 0
**.ue[*].nrMasterId = 1
**.ue[*].nrMacCellId = 1
**.dynamicCellAssociation = true
**.enableHandover = true

#------------gNodeB config---------------
**.gnb*.mobility.initFromDisplayString = false

**.gnb1.mobility.initialX = 450m
**.gnb1.mobility.initialY = 450m
**.gnb1.mobility.initialZ = 0m

**.gnb2.mobility.initialX = 950m
**.gnb2.mobility.initialY = 450m
**.gnb2.mobility.initialZ = 0m

**.gnb*.cellularNic.bgTrafficGenerator[*].numBgUes = 0

**.gnb*.macCellId = 1
**.gnb*.macNodeId = 1

#------------mobileMEcHost config---------------
**.mobileMecHost*.masterId = 0
**.mobileMecHost*.macCellId = 0
**.mobileMecHost*.nrMasterId = 1
**.mobileMecHost*.nrMacCellId = 1

**.mobileMecHost*.isMobile = true

**.mobileMecHost*.mobility.initFromDisplayString = false

**.mobileMecHost2.mobility.typename = "StationaryMobility"
**.mobileMecHost2.mobility.initialX = 400m
**.mobileMecHost2.mobility.initialY = 450m

**.mobileMecHost1.mobility.typename = "LinearMobility"
**.mobileMecHost1.mobility.updateInterval = 0.03s

**.mobileMecHost1.mobility.initialX = 430m
**.mobileMecHost1.mobility.initialY = 500m
**.mobileMecHost1.mobility.initialMovementHeading = 0deg
**.mobileMecHost1.mobility.speed = 10mps


**.hasRNISupport = true

# tcp settings
**.tcp.typename = "Tcp"
**.tcp.advertisedWindow = 65535         # in bytes, corresponds with the maximal receiver buffer capacity (Note: normally, NIC queues should be at least this size)
**.tcp.tcpAlgorithmClass = "TcpReno"    # TcpReno/TcpTahoe/TcpNewReno/TcpNoCongestionControl/DumbTcp
**.tcp.sackSupport = true               # Selective Acknowledgment (RFC 2018, 2883, 3517) support (header option) (SACK will be enabled for a connection if both endpoints support it)

##########################################################
#                    App Layer                           #
##########################################################

#########################_UE Side_#######################

#------------UERequestApp---------------
*.ue[*].numApps = 2
*.ue[*].app[0].typename = "DeviceApp"
*.ue[*].app[0].localPort = 4500
*.ue[*].app[0].ualcmpAddress = "ualcmp"
*.ue[*].app[0].ualcmpDestPort = 1000
*.ue[*].app[0].appPackageSource = "ApplicationDescriptors/ResponseCbrApp.json"

*.ue[*].app[1].typename = "UERequestCbrApp"
*.ue[*].app[1].deviceAppAddress = "ue["+string(ancestorIndex(1))+"]"
*.ue[*].app[1].deviceAppPort = 4500
*.ue[*].app[1].startTime = uniform(1s, 5s)										#when sending start request app									#period to sending messages
*.ue[*].app[1].stopTime = 250s

# packet size / send interval
*.ue[*].app[1].requestPacketSize = ${pktSize=500B}
*.ue[*].app[1].period = 20ms

### MEC Response App
**.responsePacketSize = ${pktSize}										#when sending stop MEC response app

#----------------------------------------

######################_ME Host Side_#####################

# resources available
*.mobileMecHost*.maxMECApps = 100										#max ME Apps to instantiate
*.mobileMecHost*.maxRam = 32GB											#max KBytes of Ram Space
*.mobileMecHost*.maxDisk = 100TB											#max KBytes of Ram Space
*.mobileMecHost*.maxCpuSpeed = 400000									#max percentage of CPU
#----------------------------------------

*.mobileMecHost1.bsList = ["gnb1", "gnb2"]
*.mobileMecHost2.bsList = ["gnb1"]
*.mobileMecHost*.mecPlatformManager.mecOrchestrator = "mecOrchestrator"

#-------ETSI MEC Services:---------------
### mobile MEC host 1
*.mobileMecHost1.mecPlatform.numMecServices = 1
*.mobileMecHost1.mecPlatform.mecService[0].typename = "RNIService"
*.mobileMecHost1.mecPlatform.mecService[0].localAddress = "mobileMecHost1"
*.mobileMecHost1.mecPlatform.mecService[0].localPort = 10020

*.mobileMecHost1.mecPlatform.mecService[0].rng-0 = 0 # request service time
*.mobileMecHost1.mecPlatform.mecService[0].rng-1 = 1 # subscription service time
*.mobileMecHost1.mecPlatform.mecService[0].requestServiceTime = 100us
*.mobileMecHost*.mecPlatform.mecService[0].subscriptionServiceTime = 11us

*.mobileMecHost1.mecPlatform.serviceRegistry.localAddress = "mobileMecHost1"
*.mobileMecHost1.mecPlatform.serviceRegistry.localPort = 10021

*.mobileMecHost1.mecPlatform.serviceRegistry.rng-0 = 0 # request service time
*.mobileMecHost1.mecPlatform.serviceRegistry.rng-1 = 1 # subscription service time

### mobile MEC host 2
*.mobileMecHost2.mecPlatform.numMecServices = 1
*.mobileMecHost2.mecPlatform.mecService[0].typename = "RNIService"
*.mobileMecHost2.mecPlatform.mecService[0].localAddress = "mobileMecHost2"
*.mobileMecHost2.mecPlatform.mecService[0].localPort = 10020

*.mobileMecHost2.mecPlatform.mecService[0].rng-0 = 0 # request service time
*.mobileMecHost2.mecPlatform.mecService[0].rng-1 = 1 # subscription service time
*.mobileMecHost2.mecPlatform.mecService[0].requestServiceTime = 100us
*.mobileMecHost2.mecPlatform.mecService[0].subscriptionServiceTime = 11us

*.mobileMecHost2.mecPlatform.serviceRegistry.localAddress = "mobileMecHost2"
*.mobileMecHost2.mecPlatform.serviceRegistry.localPort = 10021

*.mobileMecHost2.mecPlatform.serviceRegistry.rng-0 = 0 # request service time
*.mobileMecHost2.mecPlatform.serviceRegistry.rng-1 = 1 # subscription service time


#------- MEC orchestrator---------------
**.mecOrchestrator.mecHostList = ["mobileMecHost1", "mobileMecHost2"]
**.mecOrchestrator.mecApplicationPackageList = ["ResponseCbrApp"]   # List of MEC app descriptors to be onboarded at
**.mecOrchestrator.selectionPolicy = "MigrationSelectionBased"

# ############################################################################## #

# Config
# Benchmark configuration with a standard mecHost moving linearly in the network 
# and connecting to different gnb through handover procedure but no app migration is performed
[Config handover_no_migration]
 
**.mobileMecHost*.doMigration = false


# Configuration with a mobile Mec Host moving linearly in the network
# performin handover and app migration

[Config handover_with_migration]

**.mobileMecHost1.doMigration = true


# ----------------------------------------------------------------------------- #
