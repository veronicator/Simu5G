[Config RandomMobility]
extends = CellCenter

*.mecHost.mobility.typename = "RandomWaypointMobility"
*.mecHost.mobility.initFromDisplayString = false
*.mecHost.mobility.updateInterval = 0.05s


**.mecHost.mobility.initialX = uniform(this.constraintAreaMinX, this.constraintAreaMaxX)
**.mecHost.mobility.initialY = uniform(this.constraintAreaMinX, this.constraintAreaMaxX)
**.mecHost.mobility.speed = exponential(10mps)

